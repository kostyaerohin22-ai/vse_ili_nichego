<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Вход — Шиномонтаж в Зажопинске</title>
<style>
  *{box-sizing:border-box}
  body{
    margin:0;min-height:100vh;font-family:'Inter','Segoe UI',system-ui,-apple-system,sans-serif;
    background:
      radial-gradient(90% 55% at 50% 0%,rgba(255,106,0,.10),transparent 60%),
      #F6F7F8;
    color:#1F2328;-webkit-font-smoothing:antialiased;
    display:flex;flex-direction:column;
  }
  a{color:inherit;text-decoration:none}
  button,input{font:inherit}
  .top{padding:20px}
  .back{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:#6B7178;transition:.15s}
  .back:hover{color:#FF6A00}

  .auth{flex:1;display:flex;align-items:flex-start;justify-content:center;padding:8px 20px 48px}
  .auth__card{
    width:100%;max-width:420px;background:#fff;border:1px solid #E9ECEF;border-radius:22px;
    padding:32px;box-shadow:0 20px 60px rgba(31,35,40,.09);
  }

  .logo{display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:22px}
  .logo__mark{width:44px;height:44px;border-radius:12px;background:#FF6A00;color:#fff;display:grid;place-items:center;font-weight:800;font-size:20px}
  .logo__text{font-weight:800;font-size:15px;letter-spacing:.06em;line-height:1.1}
  .logo__text small{display:block;font-weight:500;font-size:11px;letter-spacing:.02em;color:#6B7178;margin-top:2px}

  h1{font-size:24px;margin:0 0 6px;text-align:center;letter-spacing:-.01em}
  .auth__sub{font-size:14px;color:#6B7178;text-align:center;margin:0 0 24px;line-height:1.45}

  .field{margin-bottom:14px}
  .field label{display:block;font-size:12px;font-weight:700;color:#6B7178;text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px}
  .field input{
    width:100%;height:48px;border:1px solid #DDE1E5;border-radius:10px;padding:0 12px;
    background:#fff;outline:none;transition:.15s;
  }
  .field input:focus{border-color:#FF6A00;box-shadow:0 0 0 3px rgba(255,106,0,.12)}
  .field input.is-invalid{border-color:#D64545;box-shadow:0 0 0 3px rgba(214,69,69,.10)}

  .auth__row{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:4px 0 18px;font-size:13px}
  .check{display:flex;align-items:center;gap:8px;color:#4A5058}
  .check input{width:17px;height:17px;accent-color:#FF6A00}
  .auth__row a{color:#E85F00;font-weight:600}
  .auth__row a:hover{color:#B94A00}

  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;height:50px;padding:0 20px;
    border-radius:10px;border:1px solid transparent;font-weight:600;font-size:15px;cursor:pointer;
    transition:.18s;white-space:nowrap;width:100%;
  }
  .btn--primary{background:#FF6A00;color:#fff}
  .btn--primary:hover{background:#E85F00}
  .btn--ghost{background:#fff;border-color:#DDE1E5;color:#1F2328}
  .btn--ghost:hover{border-color:#FF6A00;color:#E85F00}
  .btn:disabled{background:#F3F5F6;border-color:#EDF0F2;color:#A9B0B8;cursor:not-allowed}
  .btn:focus-visible,a:focus-visible,button:focus-visible{outline:3px solid rgba(255,106,0,.35);outline-offset:2px}

  .auth__email-link{text-align:center;font-size:13px;color:#6B7178;margin:14px 0 0}
  .auth__email-link a{color:#E85F00;font-weight:600}

  .divider{display:flex;align-items:center;gap:12px;margin:24px 0 18px;color:#A9B0B8;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
  .divider::before,.divider::after{content:'';flex:1;height:1px;background:#EDF0F2}

  .demo-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
  .demo-grid .btn{height:44px;font-size:13px;padding:0 8px}

  .auth__note{font-size:12px;color:#8A9199;text-align:center;line-height:1.5;margin:20px 0 0}
  .auth__booking{display:block;text-align:center;margin-top:16px;font-size:14px;font-weight:600;color:#FF6A00}
  .auth__booking:hover{color:#B94A00}

  .alert{display:none;background:#FDECEC;color:#A32B2B;border-radius:10px;padding:11px 13px;font-size:13px;margin-bottom:14px}
  .alert.is-visible{display:block}

  @media (max-width:460px){
    .auth__card{padding:24px;border-radius:18px}
    .top{padding:16px}
  }
</style>
</head>
<body>

<div class="top">
  <a class="back" href="index.html" id="ABackHome" data-name="ABackHome">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M5 12l6-6M5 12l6 6"/></svg>
    На главную
  </a>
</div>

<main class="auth">
  <div class="auth__card">
    <a class="logo" href="index.html" id="ALogo" data-name="ALogo">
      <span class="logo__mark">Ш</span>
      <span class="logo__text">ШИНОМОНТАЖ<small>Зажопинск</small></span>
    </a>

    <h1 id="LLoginTitle" data-name="LLoginTitle">Вход в личный кабинет</h1>
    <p class="auth__sub" id="LLoginSub" data-name="LLoginSub">Введите email, указанный при записи.</p>

    <div class="alert" id="alert"></div>

    <form id="loginForm" novalidate>
      <div class="field">
        <label for="TLoginEmail">Email</label>
        <input id="TLoginEmail" type="email" placeholder="иванушка-дурачушка" autocomplete="email" name="TLoginEmail" data-name="TLoginEmail">
      </div>
      <div class="field">
        <label for="TLoginPassword">Пароль</label>
        <input id="TLoginPassword" type="password" placeholder="••••••••" autocomplete="current-password" name="TLoginPassword" data-name="TLoginPassword">
      </div>

      <div class="auth__row">
        <label class="check"><input type="checkbox" id="CRemember" name="CRemember" data-name="CRemember"> Запомнить меня</label>
        <a href="#" id="AForgot" data-name="AForgot">Забыли пароль?</a>
      </div>

      <button class="btn btn--primary" type="submit" id="BLogin" data-name="BLogin">Войти</button>
    </form>

    <p class="auth__email-link">Или <a href="#" id="AEmailLink" data-name="AEmailLink">войти по ссылке из письма</a></p>

    <div class="divider">каркас</div>

    <a class="btn btn--primary" href="cabinet-client.html" id="BLoginAsClient" data-name="BLoginAsClient">Войти как клиент</a>

    <div class="demo-grid">
      <button class="btn btn--ghost" type="button" disabled id="BRoleMasterSoon" data-name="BRoleMasterSoon">Мастер · скоро</button>
      <button class="btn btn--ghost" type="button" disabled id="BRoleOwnerSoon" data-name="BRoleOwnerSoon">Владелец · скоро</button>
    </div>

    <p class="auth__note">Аккаунт создаётся автоматически после первой записи. Отдельная регистрация не нужна.</p>
    <a class="auth__booking" href="booking.html" id="BBookingWithoutLogin" data-name="BBookingWithoutLogin">Записаться без входа</a>
  </div>
</main>

<script>
  const alertBox = document.getElementById('alert');
  const email = document.getElementById('TLoginEmail');
  const password = document.getElementById('TLoginPassword');

  function showError(text) {
    alertBox.textContent = text;
    alertBox.classList.add('is-visible');
  }

  function clearError() {
    alertBox.classList.remove('is-visible');
    alertBox.textContent = '';
    email.classList.remove('is-invalid');
    password.classList.remove('is-invalid');
  }

  document.getElementById('loginForm').addEventListener('submit', e => {
    e.preventDefault();
    clearError();

    const value = email.value.trim();

    if (!value) {
      email.classList.add('is-invalid');
      email.focus();
      return showError('Укажите email.');
    }

    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value)) {
      email.classList.add('is-invalid');
      email.focus();
      return showError('Проверьте email.');
    }

    if (!password.value) {
      password.classList.add('is-invalid');
      password.focus();
      return showError('Введите пароль или войдите по ссылке из письма.');
    }

    window.location.href = 'cabinet-client.html';
  });

  document.getElementById('AForgot').addEventListener('click', e => {
    e.preventDefault();
    if (!email.value.trim()) {
      email.focus();
      return showError('Сначала укажите email — отправим ссылку для восстановления.');
    }
    showError('Ссылка для восстановления отправлена на ' + email.value.trim());
    alertBox.style.background = '#EAF7EF';
    alertBox.style.color = '#1B7A45';
  });

  document.getElementById('AEmailLink').addEventListener('click', e => {
    e.preventDefault();
    if (!email.value.trim()) {
      email.focus();
      return showError('Укажите email, и мы отправим ссылку для входа.');
    }
    showError('Ссылка для входа отправлена на ' + email.value.trim());
    alertBox.style.background = '#EAF7EF';
    alertBox.style.color = '#1B7A45';
  });
</script>
</body>
</html>
